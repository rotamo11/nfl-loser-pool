name: Weekly Missing Pick Deadline Reminders
on:
  schedule:
    - cron: '0 16 * * 4'  # Thursday 12:00 PM ET (16:00 UTC)
    - cron: '0 13 * * 0'  # Sunday 9:00 AM ET (13:00 UTC)
jobs:
  send-alerts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install supabase
      - env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python background_cron_reminders.py
