name: Weekly Missing Pick Deadline Reminders
on:
  workflow_dispatch:
  schedule:
    # Thursday ~11:52 AM ET (15:52 UTC in EDT / 16:52 UTC in EST)
    - cron: '52 15 * * 4'
    - cron: '52 16 * * 4'
    # Sunday ~8:52 AM ET (12:52 UTC in EDT / 13:52 UTC in EST)
    - cron: '52 12 * * 0'
    - cron: '52 13 * * 0'
jobs:
  send-alerts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install supabase
      - env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          APP_URL: ${{ secrets.APP_URL }}
        run: python background_cron_reminders.py
