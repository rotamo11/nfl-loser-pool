name: Weekly NFL Loser Pool Deadline Enforcer

on:
  schedule:
    # 12:00 PM ET (16:00 UTC during EDT / 17:00 UTC during EST)
    - cron: '0 16 * * 0'
    - cron: '0 17 * * 0'
  workflow_dispatch:

jobs:
  enforce-locks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Initialize Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Network Dependencies
        run: pip install supabase requests

      - name: Execute Lock & Fallback Script Engine
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          APP_URL: ${{ secrets.APP_URL }}
        run: python lock_deadline.py
